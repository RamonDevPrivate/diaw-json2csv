---
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: basedpyright
        run: uv run --locked basedpyright

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync --locked
      - name: pytest
        run: uv run --locked pytest

  sast:
    name: SAST scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # required for actions/checkout to fetch repo contents if this repo is private
      security-events: write # required for uploading results to code scanning
    container:
      image: semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 # 1.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep
        run: |
          set -o pipefail
          semgrep scan \
          --metrics=off \
          --config p/security-audit \
          --config p/secrets \
          --config p/python \
          --severity ERROR \
          --error \
          --sarif \
          --output semgrep.sarif
      - name: Print Semgrep results
        if: failure()
        run: |
          if [ -f semgrep.sarif ]; then
            echo "=== Semgrep blocking findings ==="
            jq -r '
              .runs[].results[]
              | .locations[0].physicalLocation as $loc
              | "\(.ruleId) | \($loc.artifactLocation.uri):\($loc.region.startLine) | \(.message.text)"
            ' semgrep.sarif
          else
            echo "No semgrep.sarif found"
          fi
      - name: Upload Semgrep results to Github Security tab
        if: >-
          always() && github.event.repository.visibility == 'public'
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: sast
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 14
